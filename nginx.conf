server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Revalidate CSS/JS on every request. The kiosk has one local
    # client over LAN — caching saves no bandwidth, and a stale
    # cached player.css blocks every visual fix from ever being
    # seen without manually clearing Chromium's cache directory.
    # Cache-busting via ?v=<sha> in index.html is the primary
    # mechanism; these headers are the belt + suspenders.
    location ~* \.(css|js)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # No cache for HTML (always get latest)
    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "ALLOWALL";
    add_header X-Content-Type-Options "nosniff";

    # Gzip
    gzip on;
    gzip_types text/css application/javascript text/html;
}
