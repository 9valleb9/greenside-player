<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenside Live</title>
  <!-- ?v=__VERSION__ is rewritten by Dockerfile at build time to the
       git SHA so every new image cache-busts the browser cache. If you
       see __VERSION__ verbatim in DevTools, the build-arg didn't pass. -->
  <link rel="stylesheet" href="player.css?v=__VERSION__">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
  <!-- Video Layer -->
  <div id="video-container">
    <video id="player" muted autoplay playsinline></video>
  </div>

  <!-- Overlays (visible when live) -->
  <div id="overlays" class="hidden">
    <!-- Tournament Info — top left -->
    <div id="tournament-bar">
      <span id="tournament-name"></span>
      <span id="current-hole"></span>
    </div>

    <!-- Active Team — top right -->
    <div id="active-team" class="hidden">
      <div id="active-team-name"></div>
      <div id="active-team-hole"></div>
      <div id="active-team-members"></div>
    </div>

    <!-- Bottom bar: leaderboard ticker + sponsors -->
    <div id="bottom-bar">
      <div id="leaderboard-ticker" class="hidden">
        <div id="leaderboard-label">LEADERBOARD</div>
        <div id="leaderboard-track">
          <div id="leaderboard-content"></div>
        </div>
      </div>
      <div id="sponsor-bar" class="hidden">
        <span id="sponsor-text"></span>
        <img id="sponsor-logo" class="hidden" alt="">
      </div>
    </div>
  </div>

  <!-- Parimutuel Tote Board (alternate display mode) -->
  <div id="tote-board" class="hidden">
    <!-- Top strip: event name + status + countdown -->
    <div class="tote-header">
      <div class="tote-event">
        <div class="tote-event-meta">
          <span class="tote-event-label">PICKS POOL</span>
          <span id="tote-status" class="tote-status tote-status-open">OPEN</span>
        </div>
        <h1 id="tote-event-name">—</h1>
      </div>
      <div class="tote-countdown">
        <div class="tote-countdown-label">CLOSES IN</div>
        <div id="tote-countdown-value">—</div>
      </div>
    </div>

    <!-- Pool totals strip -->
    <div class="tote-pools">
      <div class="tote-pool" data-pool="win">
        <span class="tote-pool-label">WIN</span>
        <span id="tote-win-pool" class="tote-pool-value">$0</span>
      </div>
      <div class="tote-pool" data-pool="place">
        <span class="tote-pool-label">PLACE</span>
        <span id="tote-place-pool" class="tote-pool-value">$0</span>
      </div>
      <div class="tote-pool" data-pool="show">
        <span class="tote-pool-label">SHOW</span>
        <span id="tote-show-pool" class="tote-pool-value">$0</span>
      </div>
      <div class="tote-pool tote-pool-total" data-pool="total">
        <span class="tote-pool-label">TOTAL POOL</span>
        <span id="tote-total-pool" class="tote-pool-value">$0</span>
      </div>
    </div>

    <!-- Main odds grid -->
    <div class="tote-grid">
      <div class="tote-grid-header">
        <div class="tote-col tote-col-team">TEAM</div>
        <div class="tote-col tote-col-odds">WIN</div>
        <div class="tote-col tote-col-odds">PLACE</div>
        <div class="tote-col tote-col-odds">SHOW</div>
        <div class="tote-col tote-col-share">% POOL</div>
      </div>
      <div id="tote-grid-body" class="tote-grid-body"></div>
    </div>

    <!-- Bottom marquee: recent bets -->
    <div class="tote-marquee">
      <div class="tote-marquee-label">RECENT</div>
      <div class="tote-marquee-track">
        <div id="tote-marquee-content" class="tote-marquee-content"></div>
      </div>
    </div>
  </div>

  <!-- Offline / Standby Screen -->
  <div id="offline-screen">
    <div id="offline-content">
      <div id="greenside-logo">
        <img src="assets/logo_black.png" alt="Greenside Live" />
      </div>
      <div id="offline-message">Stream starting soon</div>
      <div id="offline-pulse"></div>
    </div>
  </div>

  <!-- Web mode controls -->
  <div id="web-controls" class="hidden">
    <button id="btn-mute" title="Toggle mute">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
        <path id="mute-slash" d="M16.5 12A4.5 4.5 0 0014 8v8a4.47 4.47 0 002.5-4z"/>
      </svg>
    </button>
    <button id="btn-fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
    </button>
  </div>

  <script src="player.js?v=__VERSION__"></script>
</body>
</html>
